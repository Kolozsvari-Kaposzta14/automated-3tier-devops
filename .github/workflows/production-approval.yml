# ---------------------------------------------------------
# Production release authorization
#
# This workflow authorizes an already tested release.
# It does not build images, access AWS or deploy containers.
#
# Actual deployment is performed separately by the trusted
# local deployment controller after approval verification.
# ---------------------------------------------------------

name: Production Approval

# Bind the workflow run identity to the requested release
# and the two locally generated evidence checksums.
run-name: >-
  Production approval |
  ${{ inputs.release_tag }} |
  ${{ inputs.manifest_sha256 }} |
  ${{ inputs.acceptance_sha256 }}

on:
  # Production authorization must be initiated manually.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact accepted release tag
        required: true
        type: string

      manifest_sha256:
        description: SHA-256 of the accepted release manifest
        required: true
        type: string

      acceptance_sha256:
        description: SHA-256 of the staging acceptance record
        required: true
        type: string

# This workflow requires no repository API permissions.
# In particular, it cannot obtain an AWS OIDC token.
permissions: {}

jobs:
  validate-request:
    name: Validate Production Request

    # Only the protected main branch may authorize releases.
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Validate authorization parameters

        # Pass user-controlled inputs as environment variables.
        # Never interpolate them directly into shell source.
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          ACCEPTANCE_SHA256: ${{ inputs.acceptance_sha256 }}

        shell: bash

        run: |
          set -Eeuo pipefail

          # Validate the release tag generated by our
          # existing Continuous Deployment workflow.
          if [[ ! "$RELEASE_TAG" =~ ^sha-[0-9a-f]{12}-[1-9][0-9]{0,19}-[1-9][0-9]{0,9}$ ]]; then
            echo "Invalid release tag"
            exit 1
          fi

          # Require lowercase hexadecimal SHA-256 values.
          if [[ ! "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid manifest checksum"
            exit 1
          fi

          if [[ ! "$ACCEPTANCE_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid acceptance checksum"
            exit 1
          fi

          echo "PASS: Release authorization parameters"

          # Make the requested release visible to the reviewer.
          {
            echo "## Production authorization request"
            echo
            echo "| Parameter | Value |"
            echo "|---|---|"
            printf '| Release tag | `%s` |\n' "$RELEASE_TAG"
            printf '| Manifest SHA-256 | `%s` |\n' "$MANIFEST_SHA256"
            printf '| Acceptance SHA-256 | `%s` |\n' "$ACCEPTANCE_SHA256"
            echo
            echo "Manual production approval is required."
            echo
            echo "The local deployment controller will verify"
            echo "the release and acceptance evidence independently."
          } >> "$GITHUB_STEP_SUMMARY"

  authorize-production:
    name: Authorize Production Release

    # Authorization cannot proceed if validation fails.
    needs: validate-request

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    timeout-minutes: 5

    # GitHub pauses this job until the configured
    # production environment protection rules are satisfied.
    environment:
      name: production

    steps:
      - name: Record approved production authorization

        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          ACCEPTANCE_SHA256: ${{ inputs.acceptance_sha256 }}

        shell: bash

        run: |
          set -Eeuo pipefail

          # Revalidate parameters after the approval gate.
          [[ "$RELEASE_TAG" =~ ^sha-[0-9a-f]{12}-[1-9][0-9]{0,19}-[1-9][0-9]{0,9}$ ]]
          [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ACCEPTANCE_SHA256" =~ ^[0-9a-f]{64}$ ]]

          {
            echo "## Production authorization completed"
            echo
            echo "| Parameter | Value |"
            echo "|---|---|"
            printf '| Release tag | `%s` |\n' "$RELEASE_TAG"
            printf '| Manifest SHA-256 | `%s` |\n' "$MANIFEST_SHA256"
            printf '| Acceptance SHA-256 | `%s` |\n' "$ACCEPTANCE_SHA256"
            echo
            echo "The production environment gate was satisfied."
            echo
            echo "No containers have been deployed."
            echo "Local deployment verification remains required."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "PRODUCTION AUTHORIZATION COMPLETED"
