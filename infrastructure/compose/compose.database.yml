# Phase 2 only: run PostgreSQL locally while frontend/backend run on the host.
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Development-only values; do not reuse them for staging or production.
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks_app
      POSTGRES_PASSWORD: tasks_dev_only
    ports:
      # Bind to loopback so PostgreSQL is not exposed to other network clients.
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volumes keep tasks after container restarts.
      - tasks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks_app -d tasks"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  tasks_pgdata:
